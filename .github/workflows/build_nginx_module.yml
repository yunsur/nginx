name: Build Nginx

on:
  workflow_dispatch:
    inputs:
      debian_version:
        description: "Debian Version (e.g., 12)"
        required: true
      nginx_version:
        description: "Nginx Version (e.g., 1.26.3)"
        required: true

jobs:
  build:
    name: Build Nginx
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker buildx build \
            --file docker/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --tag nginx-module-builder:multiarch \
            --build-arg DEBIAN_VERSION=${{ inputs.debian_version }} \
            --build-arg NGINX_VERSION=${{ inputs.nginx_version }} \
            --output type=local,dest=./output \
            .

      - name: Flatten .deb Files
        run: |
          mkdir -p ./debs
          find ./output -type f -name "*.deb" -exec cp {} ./debs/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ inputs.nginx_version }}"
          name: "release-${{ inputs.nginx_version }}"
          body: "nginx-${{ inputs.nginx_version }}"
          files: ./debs/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
